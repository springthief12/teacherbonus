# 노래 맞히기 게임(song-quiz) 테스트 서버 – Render 무료 플랜
# 기존 티처툴 페이지(Cloudflare Pages)와는 상관없이 song-quiz 폴더만 배포합니다.
services:
  - type: web
    name: song-quiz
    runtime: node
    plan: free
    region: singapore
    rootDir: song-quiz
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      # 음원 관리 페이지에서 고친 내용을 이 저장소에 저장 (GITHUB_TOKEN은 Render 대시보드에서 직접 입력)
      - key: GITHUB_REPO
        value: springthief12/teacherbonus
      - key: GITHUB_BRANCH
        value: master
