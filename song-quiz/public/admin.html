<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F2ECE1">
  <meta name="robots" content="noindex">
  <title>음원 관리 – 그때 그 노래</title>
  <link rel="stylesheet" href="vendor/pretendard/pretendardvariable-dynamic-subset.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <main class="admin">
    <header class="admin-head">
      <div>
        <h1>음원 관리</h1>
        <p>곡마다 게임에서 나올 유튜브 음원을 확인하고 고쳐요. 음원을 못 찾은 곡은 셔플에서 빠져요.</p>
      </div>
      <a class="btn" href="/">게임으로</a>
    </header>

    <!-- 로그인 -->
    <section class="panel login" id="login" hidden>
      <h2>관리자 비밀번호</h2>
      <p id="login-note" class="muted"></p>
      <form id="login-form" class="login-form">
        <input type="password" id="password" autocomplete="current-password" placeholder="비밀번호">
        <button class="btn primary" type="submit">들어가기</button>
      </form>
    </section>

    <!-- 본문 -->
    <section id="workspace" hidden>
      <p class="storage" id="storage"></p>

      <div class="toolbar">
        <div class="seg" id="years" role="group" aria-label="연도"></div>
        <div class="seg" id="filter" role="group" aria-label="보기">
          <button type="button" data-filter="all" aria-pressed="true">전체</button>
          <button type="button" data-filter="problem" aria-pressed="false">확인이 필요한 곡</button>
        </div>
        <div class="toolbar-end">
          <span class="summary" id="summary"></span>
          <button class="btn" id="check-all" type="button">검사 안 한 곡 검사</button>
        </div>
      </div>
      <p class="progress" id="progress" hidden></p>

      <ol class="song-list" id="song-list"></ol>
    </section>
  </main>

  <!-- 미리 듣기 -->
  <aside class="preview" id="preview" hidden aria-label="미리 듣기">
    <div class="preview-frame" id="preview-frame"></div>
    <div class="preview-info">
      <strong id="preview-title"></strong>
      <span id="preview-sub"></span>
    </div>
    <button class="btn small" id="preview-close" type="button">닫기</button>
  </aside>

  <div class="toast" id="toast" role="status" hidden></div>
  <script src="js/admin.js"></script>
</body>
</html>
